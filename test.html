<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SKIINBOX — Test de estilo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="container">
    <a class="logo" href="index.html"><span class="mark"></span><div class="mark" style="display:none"></div><div style="display:flex;flex-direction:column"><strong style="font-family:'Playfair Display',serif;color:#2f2f2f">SKIINBOX</strong><small style="color:var(--muted)">Moda por suscripción · Perú</small></div></a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="vision.html">Visión</a>
      <a href="mision.html">Misión</a>
      <a href="historia.html">Historia</a>
      <a href="colecciones.html">Colecciones</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>
  
<main class="section container">
  <h2 style="font-family:'Playfair Display',serif">Test de estilo</h2>
  <p>Responde estas preguntas para definir tu perfil. (Almacenado localmente para demo)</p>
  <form id="styleForm" style="margin-top:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:900px">
    <input name="nombre" placeholder="Nombre completo" style="padding:10px;border-radius:6px;border:1px solid #ddd" required />
    <select name="ocasiones" style="padding:10px;border-radius:6px;border:1px solid #ddd">
      <option>Oficina</option><option>Casual</option><option>Eventos</option><option>Deportivo</option>
    </select>
    <input name="colores" placeholder="Colores preferidos" style="padding:10px;border-radius:6px;border:1px solid #ddd" />
    <select name="prioridad" style="padding:10px;border-radius:6px;border:1px solid #ddd">
      <option>Comodidad</option><option>Tendencia</option><option>Marca</option><option>Sostenibilidad</option>
    </select>
    <input name="presupuesto" placeholder="Presupuesto por prenda" style="padding:10px;border-radius:6px;border:1px solid #ddd" />
    <input name="talla_arriba" placeholder="Talla - arriba" style="padding:10px;border-radius:6px;border:1px solid #ddd" />
    <input name="talla_abajo" placeholder="Talla - abajo" style="padding:10px;border-radius:6px;border:1px solid #ddd" />
    <div style="grid-column:1/-1">
      <button type="submit" class="btn primary">Generar perfil</button>
      <span id="status" style="margin-left:12px;color:green"></span>
    </div>
  </form>
</main>

  <footer class="footer">
    © 2025 SKIINBOX — Moda con propósito · Todos los derechos reservados.
  </footer>
  <div id="payModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center">
    <div style="background:white;padding:20px;border-radius:10px;max-width:420px;width:90%">
      <h3>Suscripción — <span class="plan-name"></span></h3>
      <p>Precio: <strong class="plan-price"></strong> / mes</p>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button id="payClose" style="padding:8px 12px;border-radius:6px">Cancelar</button>
        <button id="payConfirm" style="padding:8px 12px;background:var(--ink);color:white;border-radius:6px">Pagar</button>
      </div>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
